name: Build Alice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Alice source
        run: |
          unzip -o Alice_v0.1_android_source_fixed.zip -d extracted
          cp -r extracted/AliceAndroid/* .
          cp -r extracted/AliceAndroid/.[!.]* . 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Alice APK
        uses: actions/upload-artifact@v4
        with:
          name: Alice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
